<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimX Studio</title>
  <link rel="stylesheet" href="/src/scss/animx.scss">
  <link rel="stylesheet" href="/src/scss/studio/animx-studio.scss">
</head>
<body class="ax-studio">
  
  <div class="ax-studio-toolbar">
    <div class="ax-studio-title">
      <h1>AnimX <span>Studio</span></h1>
      <span class="ax-studio-version">v3.0.0</span>
    </div>
    <div class="ax-studio-modes">
      <button class="ax-studio-mode-btn active" data-mode="preset">Elements</button>
      <button class="ax-studio-mode-btn" data-mode="project">Projects</button>
      <button class="ax-studio-mode-btn" data-mode="workflow">Workflows</button>
      <button class="ax-studio-mode-btn" data-mode="scanner">Scanner</button>
      <button class="ax-studio-mode-btn" data-mode="themes">Theme Kits</button>
      <button class="ax-studio-mode-btn" data-mode="packages">Packages</button>
      <button class="ax-studio-mode-btn" data-mode="qa">QA Assistant</button>
      <button class="ax-studio-mode-btn" data-mode="catalog">Creative Catalog</button>
      <button class="ax-studio-mode-btn" data-mode="release">Release</button>
    </div>
    <div class="ax-studio-actions">
      <button id="btn-device-desktop" title="Desktop View">💻</button>
      <button id="btn-device-tablet" title="Tablet View">📱</button>
      <button id="btn-device-mobile" title="Mobile View">📱</button>
      <button id="btn-reduced-motion" title="Toggle Reduced Motion">RM</button>
      <button id="btn-audit" title="Run Audit">Audit</button>
      <button id="btn-export-json" title="Export as JSON">⬇️ JSON</button>
      <button id="btn-import-json" title="Import JSON">⬆️ JSON</button>
    </div>
  </div>

  <div class="ax-studio-layout">
    
    <div class="ax-studio-sidebar" id="studio-sidebar">
      <h3>Templates</h3>
      <div id="template-list"></div>
      
      <h3 style="margin-top: 20px;">Presets</h3>
      <input type="text" id="preset-search" placeholder="Search presets...">
      <div id="preset-list"></div>
    </div>
    
    <div class="ax-studio-canvas-area">
      <div class="ax-studio-canvas" id="studio-canvas">
        <!-- Templates loaded here -->
        <div class="ax-studio-canvas-content">
          <div style="padding: 50px; text-align: center;">
            <h1 data-ax="fade-up">Select a template to begin</h1>
          </div>
          </section>

      <!-- CREATIVE CATALOG PANEL -->
      <section id="panel-catalog" class="ax-studio-panel" style="display: none;">
        <div class="ax-panel-header">
          <h2>Creative Catalog (v3.6.0)</h2>
          <p>Browse and preview zero-dependency creative effects.</p>
        </div>
        
        <div class="ax-catalog-filters">
          <select id="catalog-element-filter">
            <option value="all">All Elements</option>
            <option value="text">Text Effects</option>
            <option value="button">Button Effects</option>
            <option value="card">Card Effects</option>
          </select>
          <select id="catalog-family-filter">
            <option value="all">All Families</option>
            <option value="roll">Rolling Text</option>
            <option value="kinetic">Kinetic Text</option>
            <option value="scroll">Scroll Typography</option>
          </select>
        </div>

        <div id="creative-preview-area" style="padding: 2rem; background: #fff; margin: 1rem 0; border: 1px solid #ccc;">
           <h1 class="preview-target text-roll-up" style="font-size: 3rem;">Creative Typography</h1>
        </div>

        <div class="ax-catalog-grid" id="catalog-grid">
           <!-- Populated by JS -->
        </div>
      </section>
      
    </main>
      </div>
      
      <div class="ax-studio-bottom-panel">
        <div class="ax-studio-code-tabs" id="export-packs">
          <button class="active" data-pack="html">HTML Class</button>
          <button data-pack="data">Data Attribute</button>
          <button data-pack="js">JavaScript API</button>
          <button data-pack="cms">CMS/No-Code</button>
          <button data-pack="wordpress">WordPress</button>
          <button data-pack="webflow">Webflow</button>
          <button data-pack="react">React</button>
          <button data-pack="vue">Vue</button>
        </div>
        <div id="export-warnings" style="display:none; padding: 10px; background: #fffbeb; color: #b45309; border-bottom: 1px solid #fde68a; font-size: 0.85rem;"></div>
        <pre class="ax-studio-code" id="code-output"></pre>
      </div>
    </div>
    
    <div class="ax-studio-inspector" id="studio-inspector">
      <h3>Configuration</h3>
      
      <div class="ax-studio-control-group">
        <label>Selected Target</label>
        <input type="text" id="ctrl-target" readonly value="None">
      </div>
      
      <div class="ax-studio-control-group">
        <label>Animation</label>
        <input type="text" id="ctrl-animation" value="fade-up">
      </div>
      
      <div class="ax-studio-control-group">
        <label>Duration (ms)</label>
        <input type="number" id="ctrl-duration" step="100" min="0">
      </div>
      
      <div class="ax-studio-control-group">
        <label>Delay (ms)</label>
        <input type="number" id="ctrl-delay" step="50" min="0">
      </div>
      
      <div class="ax-studio-control-group">
        <label>Easing</label>
        <select id="ctrl-ease">
          <option value="">Default</option>
          <option value="ease">ease</option>
          <option value="ease-in">ease-in</option>
          <option value="ease-out">ease-out</option>
          <option value="ease-in-out">ease-in-out</option>
          <option value="linear">linear</option>
          <option value="spring">spring (native)</option>
        </select>
      </div>
      
      <div class="ax-studio-control-group">
        <label>Trigger</label>
        <select id="ctrl-trigger">
          <option value="">Immediate</option>
          <option value="scroll">Scroll</option>
          <option value="click">Click</option>
          <option value="hover">Hover</option>
        </select>
      </div>
      
      <button class="ax-studio-btn ax-studio-btn-primary" id="btn-play">Replay Animation</button>
      <button class="ax-studio-btn" id="btn-reset">Reset Elements</button>
    </div>
    
  </div>

  <script type="module" src="/src/js/animx.js"></script>
  <script type="module" src="/src/js/studio/studio-core.js"></script>
</body>
</html>
